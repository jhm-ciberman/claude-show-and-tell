            document.getElementById('lightbox-image').src = image.url;
            resetZoom();
            resetArea();
            document.getElementById('lightbox-title').textContent = event.title;
            document.getElementById('lightbox-meta').innerHTML = meta.map(part => `<span>${part}</span>`).join('<span>·</span>');
            document.getElementById('lightbox-note-text').textContent = event.text;
            document.getElementById('lightbox-note').classList.toggle('hidden', !event.text);
            document.getElementById('lightbox-download').href = image.url;
            document.getElementById('lightbox-download').download = image.name;
            document.getElementById('comment-form').classList.toggle('hidden', !isOpen(state.current));
            document.getElementById('lightbox').classList.replace('hidden', 'flex');
            updatePick();
            renderStrip();
            window.lucide?.createIcons();
        }

        /**
         * Offers to pick the option on screen when the viewer walks the options of an open question.
         */
        function updatePick() {
            const button = document.getElementById('lightbox-pick');
            const item = state.lightbox.items[state.lightbox.index];
            const isOption = isLightboxOpen() && item && isPending(item.event) && isOpen(state.current);

            button.classList.toggle('hidden', !isOption);
            button.classList.toggle('flex', Boolean(isOption));

            if (!isOption) {
                return;
            }

            const isChosen = draftFor(item.event.id).choices.includes(item.index);
            const name = `${LETTERS[item.index]}${item.image.label ? ` · ${item.image.label}` : ''}`;
            button.dataset.choose = item.event.id;
            button.dataset.index = String(item.index);
            button.className = `flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-extrabold transition ${isChosen ? 'bg-emerald-500 text-white hover:bg-emerald-600' : 'bg-clay-500 text-white hover:bg-clay-600'}`;
            button.innerHTML = isChosen
                ? `${icon('check', 'h-4 w-4')} Picked ${escapeHtml(name)}`
                : `${icon('circle', 'h-4 w-4')} Pick ${escapeHtml(name)}`;
            window.lucide?.createIcons();
        }

        const MAX_ZOOM = 8;
        const zoom = { scale: 1, x: 0, y: 0, drag: null };

        /**
         * How much the viewer shrinks or grows the image to fit it whole: 1 is the image's own pixels.
         */
        function fitScale() {
            const image = document.getElementById('lightbox-image');
            const stage = document.getElementById('lightbox-stage').getBoundingClientRect();

            return image.naturalWidth
                ? Math.min(stage.width / image.naturalWidth, stage.height / image.naturalHeight)
                : 1;
        }

        function applyZoom() {
            const image = document.getElementById('lightbox-image');
            const label = document.getElementById('lightbox-zoom');
            const pixels = zoom.scale * fitScale();

            image.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.scale})`;
            // Past twice its own size an image reads better as sharp pixels than as a blur.
            image.style.imageRendering = pixels >= 2 ? 'pixelated' : 'auto';
            label.textContent = `${Math.round(pixels * 100)}%`;
            label.classList.toggle('hidden', zoom.scale === 1);
            document.getElementById('lightbox-stage').style.cursor = area.isOn
                ? 'crosshair'
                : zoom.scale > 1 ? (zoom.drag ? 'grabbing' : 'grab') : 'zoom-in';
            drawAreaBox();
        }

        // An area marked on the image to ask about, in the image's own pixels so it stays put through zoom and pan.
        const area = { isOn: false, box: null, start: null };

        function imageMetrics() {
            const image = document.getElementById('lightbox-image');
            const stage = document.getElementById('lightbox-stage').getBoundingClientRect();
            const fit = fitScale();

            return {
                image,
                fit,
                width: image.naturalWidth,
                height: image.naturalHeight,
                offsetX: (stage.width - image.naturalWidth * fit) / 2,
                offsetY: (stage.height - image.naturalHeight * fit) / 2,
            };
        }

        /**
         * A point on the stage as a pixel of the image, through the zoom, the pan and the fitting.
         */
        function stageToImage(pointX, pointY) {
            const { fit, width, height, offsetX, offsetY } = imageMetrics();
            const x = ((pointX - zoom.x) / zoom.scale - offsetX) / fit;
            const y = ((pointY - zoom.y) / zoom.scale - offsetY) / fit;

            return [Math.min(width, Math.max(0, x)), Math.min(height, Math.max(0, y))];
        }

        function imageToStage(x, y) {
            const { fit, offsetX, offsetY } = imageMetrics();

            return [(x * fit + offsetX) * zoom.scale + zoom.x, (y * fit + offsetY) * zoom.scale + zoom.y];
        }

        function drawAreaBox() {
            const element = document.getElementById('area-box');

            if (!area.box) {
                element.classList.add('hidden');

                return;
            }

            const [left, top] = imageToStage(area.box.x0, area.box.y0);
            const [right, bottom] = imageToStage(area.box.x1, area.box.y1);
            Object.assign(element.style, { left: `${left}px`, top: `${top}px`, width: `${right - left}px`, height: `${bottom - top}px` });
            element.classList.remove('hidden');
        }

        function updateAreaControls() {
            const toggle = document.getElementById('area-toggle');
            toggle.classList.toggle('bg-clay-500', area.isOn);
            toggle.classList.toggle('bg-white/10', !area.isOn);
            toggle.querySelector('span').textContent = area.isOn ? 'Drag over the image…' : 'Ask about an area';
            document.getElementById('comment-input').placeholder = area.box ? 'Ask about the marked area…' : 'Write a note about this image…';
            document.getElementById('area-clear').classList.toggle('hidden', !area.box);
            applyZoom();
        }

        function resetArea() {
            Object.assign(area, { isOn: false, box: null, start: null });
            updateAreaControls();
        }

        function canvasOf(width, height) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            return canvas;
        }

        /**
         * Sends a question about the marked area, with the area cut out and the whole image with the area outlined.
         */
        async function sendAreaQuestion(item, text) {
            const { image, width, height } = imageMetrics();
            const box = {
                x0: Math.round(area.box.x0),
                y0: Math.round(area.box.y0),
                x1: Math.round(area.box.x1),
                y1: Math.round(area.box.y1),
            };
            const crop = canvasOf(Math.max(1, box.x1 - box.x0), Math.max(1, box.y1 - box.y0));
            crop.getContext('2d').drawImage(image, box.x0, box.y0, crop.width, crop.height, 0, 0, crop.width, crop.height);

            const marked = canvasOf(width, height);
            const context = marked.getContext('2d');
            context.drawImage(image, 0, 0);
            context.strokeStyle = '#d97757';
            context.lineWidth = Math.max(3, width / 250);
            context.strokeRect(box.x0, box.y0, box.x1 - box.x0, box.y1 - box.y0);

            return post('/areas', {
                eventId: item.event.id,
                imageIndex: item.index,
                text,
                box: { ...box, width, height },
                crop: crop.toDataURL('image/png'),
                marked: marked.toDataURL('image/png'),
            });
        }

        function resetZoom() {
            Object.assign(zoom, { scale: 1, x: 0, y: 0, drag: null });
            applyZoom();
        }

        /**
         * Keeps the zoomed image covering the stage, so it can never be panned off screen.
         */
        function clampPan() {
            const stage = document.getElementById('lightbox-stage').getBoundingClientRect();
            zoom.x = Math.min(0, Math.max(stage.width - stage.width * zoom.scale, zoom.x));
            zoom.y = Math.min(0, Math.max(stage.height - stage.height * zoom.scale, zoom.y));
        }

        /**
         * Zooms to a scale while the point under the cursor (stage coordinates) stays where it is.
         */
        function zoomAt(pointX, pointY, scale) {
            const next = Math.min(MAX_ZOOM, Math.max(1, scale));

            if (next === 1) {
                resetZoom();

                return;
            }

            zoom.x = pointX - (pointX - zoom.x) * (next / zoom.scale);
            zoom.y = pointY - (pointY - zoom.y) * (next / zoom.scale);
            zoom.scale = next;
            clampPan();
            applyZoom();
        }

        function stagePoint(event) {
            const box = document.getElementById('lightbox-stage').getBoundingClientRect();

            return [event.clientX - box.left, event.clientY - box.top];
        }

        function zoomByKey(factor) {
            const box = document.getElementById('lightbox-stage').getBoundingClientRect();
            zoomAt(box.width / 2, box.height / 2, zoom.scale * factor);
        }

        const stage = document.getElementById('lightbox-stage');

        stage.addEventListener('wheel', event => {
            event.preventDefault();
            zoomAt(...stagePoint(event), zoom.scale * Math.exp(-event.deltaY * 0.0015));
        }, { passive: false });

        // A double click shows the image at its own pixels, the size to read small text at, or fits it back.
        stage.addEventListener('dblclick', event => {
            if (zoom.scale > 1) {
                resetZoom();
            } else {
                zoomAt(...stagePoint(event), Math.max(2, 1 / fitScale()));
            }
        });

        stage.addEventListener('pointerdown', event => {
            if (area.isOn) {
                // While marking, a drag draws the area instead of panning.
                area.start = stageToImage(...stagePoint(event));
                area.box = null;
                stage.setPointerCapture(event.pointerId);
            } else if (zoom.scale > 1) {
                zoom.drag = { pointerX: event.clientX, pointerY: event.clientY, x: zoom.x, y: zoom.y };
                stage.setPointerCapture(event.pointerId);
                applyZoom();
            }
        });

        stage.addEventListener('pointermove', event => {
            if (area.start) {
                const [x, y] = stageToImage(...stagePoint(event));
                const [startX, startY] = area.start;
                area.box = { x0: Math.min(startX, x), y0: Math.min(startY, y), x1: Math.max(startX, x), y1: Math.max(startY, y) };
                drawAreaBox();
            } else if (zoom.drag) {
                zoom.x = zoom.drag.x + event.clientX - zoom.drag.pointerX;
                zoom.y = zoom.drag.y + event.clientY - zoom.drag.pointerY;
                clampPan();
                applyZoom();
            }
        });

        stage.addEventListener('pointerup', () => {
            if (area.start) {
                const isTiny = !area.box || area.box.x1 - area.box.x0 < 4 || area.box.y1 - area.box.y0 < 4;
                area.start = null;
                area.isOn = false;
                area.box = isTiny ? null : area.box;
                updateAreaControls();

                if (area.box) {
                    document.getElementById('comment-input').focus();
                }

                return;
            }

            zoom.drag = null;
            applyZoom();
        });

        /**
         * Opens the viewer on one report alone, at one of its images, so its arrows never leave the report.
         */
        function openReport(eventId, index) {
            const event = state.events.find(one => one.id === eventId);

            if (event) {
                state.lightbox = { items: flatten([event]), index };
                showLightbox();
                markViewed([eventId]);
            }
        }

        function renderStrip() {
            const strip = document.getElementById('lightbox-strip');
            const { items, index } = state.lightbox;

            strip.classList.toggle('hidden', items.length <= 1);
            strip.classList.toggle('flex', items.length > 1);
            strip.innerHTML = items.length <= 1 ? '' : items.map((item, position) => `
                <button type="button" data-step-to="${position}" class="shrink-0 overflow-hidden rounded-md bg-slate-900 transition ${position === index ? 'ring-2 ring-clay-400' : 'opacity-60 ring-1 ring-white/10 hover:opacity-100'}">
                    <img src="${escapeHtml(item.image.url)}" alt="" class="h-14 w-24 object-contain">
                </button>
            `).join('');
            strip.querySelector('.ring-clay-400')?.scrollIntoView({ block: 'nearest', inline: 'center' });
        }

        function stepLightbox(step) {
            const { items, index } = state.lightbox;
            state.lightbox.index = (index + step + items.length) % items.length;
            document.getElementById('comment-input').value = '';
            showLightbox();
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.replace('flex', 'hidden');
            document.getElementById('comment-input').value = '';
            resetArea();
        }

        function isLightboxOpen() {
            return document.getElementById('lightbox').classList.contains('flex');
        }

        function applySession(session, { seenIds = [], viewedIds = [], answers = [], reviewed = [], droppedIds = [] } = {}) {
            state.sessions.set(session.id, session);

            if (session.id !== state.current?.id) {
                return;
            }

            state.current = session;
            state.events = state.events.filter(event => !droppedIds.includes(event.id));

            for (const event of state.events) {
                if (seenIds.includes(event.id)) {
                    event.isSeen = true;
                }

                if (viewedIds.includes(event.id)) {
                    event.isViewed = true;
                }

                const change = reviewed.find(one => one.eventId === event.id);

                if (change) {
                    event.isReviewed = change.isReviewed;
                }

                const answered = answers.find(one => one.eventId === event.id);

                if (answered) {
                    event.answer = answered.answer;
                }
            }

            render();
        }

        const STREAM_HANDLERS = {
            event({ session, event }) {
                state.sessions.set(session.id, session);

                if (isPending(event)) {
                    notifyQuestion(session, event);
                }

                if (session.id === state.current?.id) {
                    state.current = session;
                    // An image read again comes back as the same event, now the newest.
                    state.events = [...state.events.filter(one => one.id !== event.id), event];
                    render();
                }

                renderSessions();
            },

            session({ session, ...changes }) {
                applySession(session, changes);
                renderSessions();
            },

            delivered({ session }) {
                applySession(session);

                if (session.id === state.current?.id) {
                    toast('Claude got your message', 'check-check');
                }
            },

            removed({ sessionId }) {
                state.sessions.delete(sessionId);

                if (sessionId === state.current?.id) {
                    selectSession(null);
                }

                renderSessions();
            },

            async open() {
                state.isConnected = true;
                renderConnection();
                const response = await fetch('/api/sessions');

                for (const session of await response.json()) {
                    state.sessions.set(session.id, session);
                }

                await selectSession(currentId());
            },

            error() {
                state.isConnected = false;
                renderConnection();
            },
        };

        /**
         * Follows the board live through the stream every tab shares (see stream-worker.js).
         */
        function connect() {
            const worker = new SharedWorker('/stream-worker.js');

            worker.port.onmessage = ({ data: message }) => {
                STREAM_HANDLERS[message.type]?.(message.data === null ? {} : JSON.parse(message.data));
            };
            worker.port.start();
        }

        async function sendAnswer(eventId) {
            const draft = draftFor(eventId);
            const isSent = await post('/messages', {
                eventId,
                answer: {
                    choices: draft.choices,
                    other: draft.isOther ? draft.text : '',
                    notes: draft.isOther ? '' : draft.text,
                },
            });

            if (isSent) {
                state.drafts.delete(eventId);
                state.questionView = null;
                render();
                toast('Answer sent', 'send');
            }
        }

        /**
         * Picks or unpicks an option; index -1 is "Other". A single-choice question keeps one pick.
         */
        function choose(eventId, index) {
            const event = state.events.find(one => one.id === eventId);
            const draft = draftFor(eventId);
            const isOther = index === -1;
            const isPicked = isOther ? draft.isOther : draft.choices.includes(index);

            if (event?.isMultiSelect) {
                if (isOther) {
                    draft.isOther = !isPicked;
                } else {
                    draft.choices = isPicked ? draft.choices.filter(one => one !== index) : [...draft.choices, index];
                }
            } else {
                draft.isOther = isOther && !isPicked;
                draft.choices = !isOther && !isPicked ? [index] : [];
            }

            render();
            updatePick();

            if (isOther && draft.isOther) {
                const field = state.questionView === eventId ? `review-answer-${eventId}` : `answer-${eventId}`;
                document.getElementById(field)?.focus();
            }
        }

        document.addEventListener('click', event => {
            const link = event.target.closest('a.session');

            if (link) {
                event.preventDefault();
                history.pushState(null, '', link.getAttribute('href'));
                selectSession(link.dataset.id);

                return;
            }

            const target = event.target.closest('[data-seen], [data-keep], [data-choose], [data-answer], [data-step], [data-step-to], [data-open], [data-close], [data-seen-agent], [data-seen-back], [data-finished], [data-notify], [data-rail], [data-area-toggle], [data-area-clear], [data-review-all], [data-review], [data-review-close], [data-mark-reviewed], [data-tab], [data-report]');

            if (!target) {
                return;
            }

            if (target.hasAttribute('data-area-toggle')) {
                area.isOn = !area.isOn;
                updateAreaControls();

                return;
            }

            if (target.hasAttribute('data-area-clear')) {
                resetArea();

                return;
            }

            if (target.hasAttribute('data-notify')) {
                Notification.requestPermission().then(renderNotifyToggle);

                return;
            }

            if (target.hasAttribute('data-rail')) {
                setRailCollapsed(!state.isRailCollapsed);

                return;
            }

            if (target.hasAttribute('data-finished')) {
                state.showFinished = !state.showFinished;
                render();

                return;
            }

            if (target.dataset.markReviewed) {
                const report = state.events.find(one => one.id === target.dataset.markReviewed);
                post(`/events/${encodeURIComponent(target.dataset.markReviewed)}/reviewed`, { isReviewed: report?.isReviewed !== true });
            } else if (target.dataset.tab) {
                state.showReviewed = target.dataset.tab === 'reviewed';
                render();
            } else if (target.dataset.report) {
                // The slider of a before-and-after follows the pointer, so a click on it is no request to open.
                const isSliding = target.tagName === 'ARTICLE' && event.target.closest('[data-slider]');

                if (!isSliding) {
                    openReport(target.dataset.report, Number(target.dataset.index));
                }
            } else if (target.dataset.stepTo) {
                state.lightbox.index = Number(target.dataset.stepTo);
                document.getElementById('comment-input').value = '';
                showLightbox();
            } else if (target.dataset.review) {
                state.questionView = target.dataset.review;
                render();
            } else if (target.hasAttribute('data-review-close')) {
                state.questionView = null;
                render();
            } else if (target.hasAttribute('data-review-all')) {
                post('/reviewed');
            } else if (target.hasAttribute('data-seen-agent')) {
                state.seenAgent = target.dataset.seenAgent || null;
                render();
            } else if (target.hasAttribute('data-seen-back')) {
                state.seenAgent = undefined;
                render();
            } else if (target.dataset.seen) {
                post(`/events/${encodeURIComponent(target.dataset.seen)}/seen`);
            } else if (target.dataset.keep) {
                const session = state.sessions.get(target.dataset.keep);
                fetch(`/api/sessions/${encodeURIComponent(target.dataset.keep)}/keep`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ isKept: session?.isKept !== true }),
                });
            } else if (target.dataset.choose) {
                choose(target.dataset.choose, Number(target.dataset.index));
            } else if (target.dataset.answer) {
                sendAnswer(target.dataset.answer);
            } else if (target.dataset.step) {
                stepLightbox(Number(target.dataset.step));
            } else if (target.dataset.open) {
                state.lightbox = { items: lists()[target.dataset.list], index: Number(target.dataset.open) };
                showLightbox();
            } else if (target.hasAttribute('data-close') && (event.target === target || target.tagName === 'BUTTON')) {
                // The backdrop closes the viewer, the picture on it does not.
                closeLightbox();
            }
        });

        document.addEventListener('input', event => {
            const { draft: eventId } = event.target.dataset;

            if (eventId) {
                const draft = draftFor(eventId);
                draft.text = event.target.value;

                for (const button of document.querySelectorAll(`[data-answer="${CSS.escape(eventId)}"]`)) {
                    button.disabled = !canSendAnswer(draft);
                }
            }
        });

        document.addEventListener('submit', async event => {
            event.preventDefault();

            if (event.target.id === 'comment-form') {
                const input = document.getElementById('comment-input');
                const item = state.lightbox.items[state.lightbox.index];

                if (!item || !input.value.trim()) {
                    return;
                }

                const isAboutArea = area.box !== null;
                const isSent = isAboutArea
                    ? await sendAreaQuestion(item, input.value)
                    : await post('/messages', { eventId: item.event.id, imageIndex: item.index, text: input.value });

                if (isSent) {
                    input.value = '';
                    resetArea();
                    toast(isAboutArea ? 'Question about the area sent' : 'Note sent', 'send');
                }
            }
        });

        // As in Claude Code: Enter sends, Shift+Enter starts a new line.
        document.addEventListener('keydown', event => {
            const field = event.target;

            if (!field.matches('textarea[data-send-on-enter]') || event.key !== 'Enter' || event.shiftKey || event.isComposing) {
                return;
            }

            event.preventDefault();

            if (field.form) {
                field.form.requestSubmit();
            } else if (field.dataset.draft) {
                document.querySelector(`[data-answer="${CSS.escape(field.dataset.draft)}"]:not([disabled])`)?.click();
            }
        });

        document.addEventListener('keydown', event => {
            if (!isLightboxOpen()) {
                if (event.key === 'Escape' && state.questionView !== null) {
                    state.questionView = null;
                    render();
                }

                return;
            }

            const isTyping = event.target.matches('input, textarea');

            if (event.key === 'Escape') {
                closeLightbox();
            } else if (!isTyping && event.key === 'ArrowLeft') {
                stepLightbox(-1);
            } else if (!isTyping && event.key === 'ArrowRight') {
                stepLightbox(1);
            } else if (!isTyping && (event.key === '+' || event.key === '=')) {
                zoomByKey(1.5);
            } else if (!isTyping && event.key === '-') {
                zoomByKey(1 / 1.5);
            } else if (!isTyping && event.key === '0') {
                resetZoom();
            }
        });

        // The session tabs reorder by dragging, like the terminal's own tabs.
        const sessionTabs = document.getElementById('sessions');

        function clearDropMarks() {
            sessionTabs.querySelectorAll('a.session').forEach(tab => {
                tab.style.boxShadow = '';
            });
        }

        function dropSpot(event) {
            const tab = event.target.closest('a.session');

            if (!tab || tab.dataset.id === state.draggedSession) {
                return null;
            }

            const box = tab.getBoundingClientRect();

            return { tab, isAfter: event.clientX > box.left + box.width / 2 };
        }

        sessionTabs.addEventListener('dragstart', event => {
            const tab = event.target.closest('a.session');

            if (tab) {
                state.draggedSession = tab.dataset.id;
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', tab.dataset.id);
                requestAnimationFrame(() => tab.classList.add('opacity-40'));
            }
        });

        sessionTabs.addEventListener('dragover', event => {
            if (!state.draggedSession) {
                return;
            }

            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            clearDropMarks();
            const spot = dropSpot(event);

            if (spot) {
                spot.tab.style.boxShadow = `${spot.isAfter ? 'inset -3px' : 'inset 3px'} 0 0 #d97757`;
            }
        });

        sessionTabs.addEventListener('drop', event => {
            event.preventDefault();
            const spot = dropSpot(event);

            if (state.draggedSession && spot) {
                moveSession(state.draggedSession, spot.tab.dataset.id, spot.isAfter);
            }
        });

        sessionTabs.addEventListener('dragend', () => {
            state.draggedSession = null;
            renderSessions();
        });

        window.addEventListener('popstate', () => selectSession(currentId()));

        setInterval(renderSessions, 30_000);
        renderConnection();
        renderNotifyToggle();
        render();
        connect();
    </script>
</body>
</html>
